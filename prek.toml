# Prek configuration (Rust-based pre-commit replacement)
# Install prek: mise install cargo-prek || cargo install prek
# Run: prek install && prek run --all-files

default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "hooks-pre-commit"
name = "hooks-pre-commit"
entry = "make hooks-pre-commit"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "hooks-pre-push"
name = "hooks-pre-push"
entry = "make hooks-pre-push"
language = "system"
pass_filenames = false
stages = ["pre-push"]
