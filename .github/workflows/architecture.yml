name: Architecture Testing

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  checks: write

jobs:
  architecture-test:
    name: Validate Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure npm for private packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci

      - name: Run smoke test
        run: npm test

      - name: Run deep regression suite
        run: npm run test:deep

      - name: Generate CI diagram artifacts
        run: npm run ci:artifacts
        continue-on-error: true

      # Architecture rule validation via diagram test --format junit
      # Replaces the legacy manifest --require-types gate.
      # Produces JUnit XML consumed by dorny/test-reporter below.
      - name: Run architecture rule tests
        run: |
          node src/diagram.js test . \
            --format junit \
            --output .diagram/architecture-results.xml
        continue-on-error: false

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagram-ci-artifacts
          path: .diagram

      - name: Report architecture test results
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Architecture Tests
          path: .diagram/architecture-results.xml
          reporter: java-junit

      - name: Check architecture test status
        run: |
          if [ -f .diagram/architecture-results.xml ]; then
            failures=$(node -e "const fs=require('fs');const xml=fs.readFileSync('.diagram/architecture-results.xml','utf8');const m=xml.match(/failures=\"(\d+)\"/);console.log(m?m[1]:'0');")
            if [ "$failures" != "0" ] && [ -n "$failures" ]; then
              echo "❌ Architecture tests failed with $failures violations"
              exit 1
            fi
          fi
          echo "✅ All architecture tests passed"
