              ...
          - pattern: "execFile(..., { ..., shell: true, ... })"
      - patterns:
          - pattern-inside: |
              const { ..., execFileSync, ... } = require('node:child_process');
              ...
          - pattern: "execFileSync(..., { ..., shell: true, ... })"
      - patterns:
          - pattern-inside: |
              import { ..., spawn, ... } from 'node:child_process';
              ...
          - pattern: "spawn(..., { ..., shell: true, ... })"
      - patterns:
          - pattern-inside: |
              import { ..., spawnSync, ... } from 'node:child_process';
              ...
          - pattern: "spawnSync(..., { ..., shell: true, ... })"
      - patterns:
          - pattern-inside: |
              import { ..., execFile, ... } from 'node:child_process';
              ...
          - pattern: "execFile(..., { ..., shell: true, ... })"
      - patterns:
          - pattern-inside: |
              import { ..., execFileSync, ... } from 'node:child_process';
              ...
          - pattern: "execFileSync(..., { ..., shell: true, ... })"
      - patterns:
          - pattern-inside: |
              const $CP = require('child_process');
              ...
          - pattern-either:
              - pattern: "$CP.spawn(..., { ..., shell: true, ... })"
              - pattern: "$CP.spawnSync(..., { ..., shell: true, ... })"
              - pattern: "$CP.execFile(..., { ..., shell: true, ... })"
              - pattern: "$CP.execFileSync(..., { ..., shell: true, ... })"
      - patterns:
          - pattern-inside: |
              import * as $CP from 'child_process';
              ...
          - pattern-either:
              - pattern: "$CP.spawn(..., { ..., shell: true, ... })"
              - pattern: "$CP.spawnSync(..., { ..., shell: true, ... })"
              - pattern: "$CP.execFile(..., { ..., shell: true, ... })"
              - pattern: "$CP.execFileSync(..., { ..., shell: true, ... })"
      - patterns:
          - pattern-inside: |
              const $CP = require('node:child_process');
              ...
          - pattern-either:
              - pattern: "$CP.spawn(..., { ..., shell: true, ... })"
              - pattern: "$CP.spawnSync(..., { ..., shell: true, ... })"
              - pattern: "$CP.execFile(..., { ..., shell: true, ... })"
