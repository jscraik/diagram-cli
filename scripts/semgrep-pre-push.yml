rules:
  - id: ts-no-eval
    message: Avoid eval in src/** code.
    severity: ERROR
    languages: [javascript, typescript]
    pattern: eval(...)

  - id: ts-no-new-function
    message: Avoid Function constructor usage in src/** code.
    severity: ERROR
    languages: [javascript, typescript]
    pattern: new Function(...)

  - id: ts-no-child-process-exec
    message: Avoid child_process exec/execSync in src/** code.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - patterns:
          - pattern-inside: |
              const { ..., exec, ... } = require('child_process');
              ...
          - pattern: exec(...)
      - patterns:
          - pattern-inside: |
              const { ..., execSync, ... } = require('child_process');
              ...
          - pattern: execSync(...)
      - patterns:
          - pattern-inside: |
              import { ..., exec, ... } from 'child_process';
              ...
          - pattern: exec(...)
      - patterns:
          - pattern-inside: |
              import { ..., execSync, ... } from 'child_process';
              ...
          - pattern: execSync(...)
      - patterns:
          - pattern-inside: |
              const $CP = require('child_process');
              ...
          - pattern-either:
              - pattern: $CP.exec(...)
              - pattern: $CP.execSync(...)
      - patterns:
          - pattern-inside: |
              import * as $CP from 'child_process';
              ...
          - pattern-either:
              - pattern: $CP.exec(...)
              - pattern: $CP.execSync(...)

  - id: ts-no-shell-true
    message: Avoid shell:true in child process options in src/** code.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'spawn(..., { ..., shell: true, ... })'
      - pattern: 'spawnSync(..., { ..., shell: true, ... })'
      - pattern: 'execFile(..., { ..., shell: true, ... })'
      - pattern: 'execFileSync(..., { ..., shell: true, ... })'